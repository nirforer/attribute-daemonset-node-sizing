{{- if not .Values.nodeSizing.enabled }}
{{/* Classic single DaemonSet with one fixed resource spec. */}}
{{- include "node-sized-agent.daemonset" (dict
      "root" .
      "suffix" ""
      "tier" "fixed"
      "resources" .Values.resources
      "affinityExpressions" (list)) }}
{{- else }}
{{- $key := .Values.nodeSizing.labelKey | required "nodeSizing.labelKey is required" }}
{{- $all := include "node-sized-agent.allInstanceTypes" . | fromJsonArray }}
{{- range .Values.nodeSizing.tiers }}
{{- $exprs := list (dict "key" $key "operator" "In" "values" .instanceTypes) }}
{{- with .matchExpressions }}{{ $exprs = concat $exprs . }}{{ end }}
---
{{ include "node-sized-agent.daemonset" (dict
      "root" $
      "suffix" .name
      "tier" .name
      "resources" (required (printf "nodeSizing.tiers[%s].resources is required" .name) .resources)
      "affinityExpressions" $exprs) }}
{{- end }}
{{- if .Values.nodeSizing.default.enabled }}
---
{{ include "node-sized-agent.daemonset" (dict
      "root" .
      "suffix" "default"
      "tier" "default"
      "resources" .Values.nodeSizing.default.resources
      "affinityExpressions" (ternary (list) (list (dict "key" $key "operator" "NotIn" "values" $all)) (empty $all))) }}
{{- end }}
{{- end }}
