apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ include "zouz-operator-chart.nsPrefix" . }}-zouz-operator"
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: true

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "{{ include "zouz-operator-chart.clusterPrefix" . }}-zouz-object-lister"
rules:
{{- include "zouz-operator-chart.objectListRules" . }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{ include "zouz-operator-chart.clusterPrefix" . }}-zouz-operator-object-lister"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: "{{ include "zouz-operator-chart.clusterPrefix" . }}-zouz-object-lister"
subjects:
- kind: ServiceAccount
  name: "{{ include "zouz-operator-chart.nsPrefix" . }}-zouz-operator"
  namespace: {{ .Release.Namespace }}

---

{{- if not .Values.daemonset.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ include "zouz-operator-chart.nsPrefix" . }}-zouz-pod-manager"
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: ["*"]
  resources: ["pods"]
  verbs: ["*"]

---
{{- end }}

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ include "zouz-operator-chart.nsPrefix" . }}-zouz-cm-reader"
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: ["*"]
  resources: ["configmaps"]
  verbs: ["get", "watch", "list"]

---

{{- if not .Values.daemonset.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ include "zouz-operator-chart.nsPrefix" . }}-zouz-operator-pod-manager"
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ include "zouz-operator-chart.nsPrefix" . }}-zouz-pod-manager"
subjects:
- kind: ServiceAccount
  name: "{{ include "zouz-operator-chart.nsPrefix" . }}-zouz-operator"
  namespace: {{ .Release.Namespace }}

---
{{- end }}

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ include "zouz-operator-chart.nsPrefix" . }}-zouz-operator-cm-reader"
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ include "zouz-operator-chart.nsPrefix" . }}-zouz-cm-reader"
subjects:
- kind: ServiceAccount
  name: "{{ include "zouz-operator-chart.nsPrefix" . }}-zouz-operator"
  namespace: {{ .Release.Namespace }}

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ include "zouz-operator-chart.sensorServiceAccountName" . }}"
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: true

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{ include "zouz-operator-chart.clusterPrefix" . }}-zouz-sensor-object-lister"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: "{{ include "zouz-operator-chart.clusterPrefix" . }}-zouz-object-lister"
subjects:
- kind: ServiceAccount
  name: "{{ include "zouz-operator-chart.sensorServiceAccountName" . }}"
  namespace: {{ .Release.Namespace }}
