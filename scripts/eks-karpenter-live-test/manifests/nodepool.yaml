# Mirrors the customer's on-demand c6i pool: one pool spanning c6i.large (2 vCPU) to c6i.8xlarge (32 vCPU).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: sensor-test
spec:
  template:
    metadata:
      labels:
        attrb.io/sensor-size: c6i-pool     # a custom pool label, as in scenario B
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: sensor-test
      expireAfter: 2h                      # safety net for the test
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c6i"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: Gt
          values: ["1"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: Lt
          values: ["34"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
  limits:
    cpu: "40"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
