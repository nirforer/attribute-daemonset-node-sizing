replicas: 1
podDisruptionBudget:
  maxUnavailable: 1
dnsPolicy: Default
logLevel: debug
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/KarpenterControllerRole-<CLUSTER_NAME>
controller:
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { memory: 1Gi }
settings:
  clusterName: <CLUSTER_NAME>
  interruptionQueue: <CLUSTER_NAME>
